name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'kubernetes/deployment.yaml'

  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:

  test:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm test || echo "No tests found"


  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint


  build:
    name: Build
    runs-on: ubuntu-latest

    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/


  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs: [build]

    env:
      IMAGE_NAME: shaileshhegde19/tic-tac-toe

    outputs:
      image_tag: ${{ steps.set_output.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          exit-code: '0'

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Set image tag
        id: set_output
        run: |
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"


  update-k8s:
    name: Update Kubernetes Deployment
    runs-on: ubuntu-latest

    needs: [docker]

    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update deployment image
        run: |
          NEW_IMAGE="docker.io/shaileshhegde19/tic-tac-toe:sha-${GITHUB_SHA}"

          sed -i "s|^[[:space:]]*image:.*|        image: ${NEW_IMAGE}|g" \
            kubernetes/deployment.yaml

          echo "Updated image:"
          echo "$NEW_IMAGE"

      - name: Show deployment change
        run: |
          git diff -- kubernetes/deployment.yaml

      - name: Commit deployment change
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add kubernetes/deployment.yaml

          git commit \
            -m "Update image to ${GITHUB_SHA} [skip ci]" \
            || echo "No changes to commit"

          git push
