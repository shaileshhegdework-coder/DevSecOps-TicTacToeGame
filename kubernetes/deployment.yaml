apiVersion: apps/v1
kind: Deployment
metadata:
  name: tic-tac-toe
  labels:
    app: tic-tac-toe

spec:
  replicas: 3

  selector:
    matchLabels:
      app: tic-tac-toe

  template:
    metadata:
      labels:
        app: tic-tac-toe

    spec:
      containers:
        - name: tic-tac-toe
        image: docker.io/shaileshhegde19/tic-tac-toe:sha-cc63214c12dec005c838bb26425fde6f882e8a38
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            limits:
              cpu: "0.5"
              memory: "512Mi"
            requests:
              cpu: "0.2"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
