# Chart.yaml
# This file identifies the chart itself — think of it as the "package.json" for Helm.
# Helm reads this before anything else to know the chart's name, type, and versioning.

apiVersion: v2          # v2 = modern Helm 3 chart format (v1 was legacy Helm 2, don't use it)
name: tic-tac-toe       # Name of the chart — used in `helm install <name>` commands
description: A Helm chart for deploying the Tic Tac Toe application
type: application        # "application" = deployable app chart. "library" = shared helper chart, not deployable on its own

# --- Versioning: these two numbers mean DIFFERENT things, orgs get this wrong constantly ---
version: 0.1.0          # CHART version — bump this when YOU change the templates/structure of the chart
appVersion: "1.0.0"      # APP version — bump this when the underlying application/image changes
                          # (they don't have to move together — you can fix a chart bug without a new app release)
