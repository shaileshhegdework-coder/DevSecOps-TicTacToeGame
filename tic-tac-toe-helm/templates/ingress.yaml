# templates/ingress.yaml
# Ingress routes external HTTP(S) traffic (based on hostname/path) to internal Services.
# Requires an Ingress Controller (e.g. nginx-ingress) already running in the cluster —
# the Ingress resource itself is just a routing RULE, not the traffic handler.

{{- if .Values.ingress.enabled }}
# Wrapping the whole file in this `if` lets you toggle Ingress on/off per environment
# just by flipping a value — e.g. disable it in a values-dev.yaml if you're only using port-forward.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tic-tac-toe.name" . }}-ingress
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    # Controller-specific tuning (rewrite rules, TLS redirects, rate limits, etc.)
    # would also go here as extra annotations, e.g.:
    # nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "tic-tac-toe.name" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
